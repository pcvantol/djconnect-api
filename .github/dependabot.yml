version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Cloudflare's test pool currently requires Vitest 4.
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-istanbul"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]
