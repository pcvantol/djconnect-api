name: Reusable workflow guard regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-api
  discovery:
    name: Sparse PATH and failure propagation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Actual Bash guard, mocked GitHub only
        run: python3 scripts/test_reusable_workflow_refs.py --scratch "${{ runner.temp }}" --report "${{ runner.temp }}/workflow-guard-regression.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reusable-workflow-guard-regression
          path: ${{ runner.temp }}/workflow-guard-regression.json
          if-no-files-found: error
