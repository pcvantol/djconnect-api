name: Rich delivery adapter
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-api
  adapter:
    name: Actual workerd rich delivery causal checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - name: Verify reusable workflow pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_reusable_workflow_refs.sh
      - run: npm ci
      - run: node_modules/.bin/tsc -p coordinator/rich-delivery/qualification/tsconfig.json --noEmit
      - name: Actual workerd, synthetic owner and APNs transport only
        env:
          TMPDIR: ${{ runner.temp }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/rich-delivery.log
        run: node_modules/.bin/vitest run --config coordinator/rich-delivery/qualification/vitest.config.mts --reporter=json --outputFile="${{ runner.temp }}/rich-delivery-tests.json"
      - run: node coordinator/rich-delivery/build-source.mjs "${{ runner.temp }}/rich-delivery-package"
      - run: node coordinator/rich-delivery/qualification/check-package.mjs "${{ runner.temp }}/rich-delivery-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rich-delivery-conformance
          path: |
            ${{ runner.temp }}/rich-delivery-tests.json
            ${{ runner.temp }}/rich-delivery-package
          if-no-files-found: error
