name: Local native experiment qualification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  host-and-private-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Offline preparation and squash-safe source history
        run: python3 -m unittest scripts/test_rendezvous_deployment_plan.py
      - name: Private files and actual default-genuine workerd negatives
        run: node --test qualification/rendezvous/local-native.check.mjs
      - name: Fixed private40381 source/profile/software-policy and actual genuine negatives
        run: node --test qualification/rendezvous/private-profile-40381.check.mjs
      - name: Fixed root sourceguard derivation refuses drift
        run: node --test qualification/rendezvous/root-integration-derivation.check.mjs
      - name: Immutable public receiver to actual local API interoperability
        run: |
          DJC_INTEROP_INPUTS="$(mktemp -d)"
          chmod 700 "$DJC_INTEROP_INPUTS"
          node qualification/rendezvous/prepare-receiver-interop.mjs "$DJC_INTEROP_INPUTS"
          npm ci --prefix "$DJC_INTEROP_INPUTS" --ignore-scripts --no-audit --no-fund
          node qualification/rendezvous/run-receiver-interop.mjs "$DJC_INTEROP_INPUTS"
          DJC_POLICY_DEPS="$(mktemp -d)"
          DJC_POLICY_OUTPUT="$RUNNER_TEMP/enrollment-policy-qualification"
          chmod 700 "$DJC_POLICY_DEPS"
          printf '{"private":true}\n' > "$DJC_POLICY_DEPS/package.json"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$DJC_POLICY_DEPS/node_modules"
          node qualification/rendezvous/run_challenge_budget_workerd.mjs "$DJC_POLICY_DEPS" "$DJC_POLICY_OUTPUT" "$DJC_INTEROP_INPUTS/node_modules/jose"
          node scripts/qualify_rendezvous_qa_profile.mjs "$DJC_POLICY_DEPS" "${DJC_POLICY_OUTPUT}-qa-profile" "$DJC_INTEROP_INPUTS/node_modules/jose"
      - name: Report allowlisted QA failure coordinates
        if: failure()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          def read_limited(path):
              with path.open('rb') as file:
                  raw = file.read(8 * 1024 * 1024 + 1)
              if len(raw) > 8 * 1024 * 1024:
                  raise ValueError('diagnostic input limit')
              return raw.decode('utf-8')
          def report_failure(root, data_root, label):
              report = {'scope': 'SHARED_WORKER_FAILURE_COORDINATES_ONLY', 'root_kind': label, 'phase': 'unavailable', 'failed_cases': []}
              log = root / 'runner.log'
              if log.is_file():
                  try:
                      match = re.search(r'Request admission qualification failed at (staging|types|tests|metadata|summary);', read_limited(log))
                      if match:
                          report['phase'] = match.group(1)
                  except (OSError, ValueError):
                      report['log_unreadable'] = True
              results = data_root / 'results-private.json'
              if results.is_file():
                  try:
                      data = json.loads(read_limited(results))
                      for key in ('numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests'):
                          value = data.get(key)
                          if type(value) is int and 0 <= value <= 1000000:
                              report[key] = value
                      for file in data.get('testResults', []):
                          for case in file.get('assertionResults', []):
                              if case.get('status') == 'failed' and type(case.get('fullName')) is str:
                                  if len(report['failed_cases']) >= 128:
                                      report['failed_cases_truncated'] = report.get('failed_cases_truncated', 0) + 1
                                      continue
                                  coordinate = hashlib.sha256(case['fullName'].encode()).hexdigest()
                                  report['failed_cases'].append(coordinate)
                                  locations, classes = set(), set()
                                  messages = case.get('failureMessages')
                                  for message in messages[:4] if type(messages) is list else []:
                                      if type(message) is str:
                                          locations.update(re.findall(r'\b(assertion-key-state\.check\.mjs):([1-9][0-9]{0,4}):([1-9][0-9]{0,4})\b', message))
                                          classes.update(kind for kind in ('service_unavailable', 'proof_rejected') if kind in message)
                                  report.setdefault('case_details', []).append({'case_sha256': coordinate,
                                      'locations': [{'file': file, 'line': int(line), 'column': int(column)} for file, line, column in sorted(locations)[:4]],
                                      'error_classes': sorted(classes)})
                  except (OSError, ValueError, TypeError, AttributeError, RecursionError):
                      report['results_unreadable'] = True
              state = data_root / 'process-state-private.json'
              if state.is_file():
                  try:
                      value = json.loads(read_limited(state))
                      status = value.get('status')
                      signal = value.get('signal')
                      if type(status) is int and -255 <= status <= 255:
                          report['test_process_status'] = status
                      if signal in (None, 'SIGTERM', 'SIGKILL', 'SIGABRT', 'SIGSEGV'):
                          report['test_process_signal'] = signal
                  except (OSError, ValueError, TypeError, AttributeError, RecursionError):
                      report['process_state_unreadable'] = True
              for kind in ('capacity', 'create', 'shared'):
                  for suffix in ('private', 'tests-private'):
                      path = data_root / (kind + '-' + suffix + '.jsonl')
                      if path.is_file():
                          try:
                              rows = [json.loads(line) for line in read_limited(path).splitlines()]
                              if len(rows) <= 1000000 and all(type(row) is dict for row in rows):
                                  report[kind + '_' + suffix + '_rows'] = len(rows)
                                  field = 'task_id' if suffix == 'private' else 'id'
                                  report[kind + '_' + suffix + '_unique_ids'] = len({row[field] for row in rows if type(row.get(field)) is str})
                          except (OSError, ValueError, TypeError, RecursionError):
                              report[kind + '_' + suffix + '_unreadable'] = True
              print(json.dumps(report, sort_keys=True))
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'enrollment-policy-qualification'
          report_failure(base, base, 'original_shared')
          report_failure(pathlib.Path(str(base) + '-qa-profile'), pathlib.Path(str(base) + '-qa-profile') / 'workerd', 'qa_derived')
          PY
  actual-browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Bound browser dependency mirror failover
        run: |
          python3 -m unittest scripts/test_browser_apt_mirrors.py
          sudo python3 scripts/prepare_browser_apt_mirrors.py
      - name: Real Chromium and WebKit crypto, QR and cancel against actual API
        run: |
          DJC_BROWSER_RECEIVER_INPUTS="$(mktemp -d)"
          DJC_BROWSER_TOOL_INPUTS="$(mktemp -d)"
          chmod 700 "$DJC_BROWSER_RECEIVER_INPUTS" "$DJC_BROWSER_TOOL_INPUTS"
          node qualification/rendezvous/prepare-receiver-interop.mjs "$DJC_BROWSER_RECEIVER_INPUTS"
          npm ci --prefix "$DJC_BROWSER_RECEIVER_INPUTS" --ignore-scripts --no-audit --no-fund
          node qualification/rendezvous/prepare-browser-interop.mjs "$DJC_BROWSER_TOOL_INPUTS"
          npm ci --prefix "$DJC_BROWSER_TOOL_INPUTS" --ignore-scripts --no-audit --no-fund
          node "$DJC_BROWSER_TOOL_INPUTS/node_modules/playwright/cli.js" install --with-deps chromium webkit
          node qualification/rendezvous/run-browser-interop.mjs "$DJC_BROWSER_RECEIVER_INPUTS" "$DJC_BROWSER_TOOL_INPUTS"
          node qualification/rendezvous/root-integration.check.mjs "$DJC_BROWSER_TOOL_INPUTS"
