name: Host app wake private receiving source
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-api
  receiving:
    name: Private receiving source (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ordinary
            config: vitest.config.mts
          - suite: isolated-vendor-model
            config: enrollment-store.config.mts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - name: Verify reusable workflow pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_reusable_workflow_refs.sh
      - run: npm ci
      - name: Strict types for both qualification suites
        if: matrix.suite == 'ordinary'
        run: node_modules/.bin/tsc --noEmit --project coordinator/host-app-wake-receiving/qualification/tsconfig.json
      - name: Actual local workerd and SQLite; modeled vendor suite is not Apple trust
        env:
          TMPDIR: ${{ runner.temp }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/host-wake-receiving-${{ matrix.suite }}.log
        run: node_modules/.bin/vitest run --config coordinator/host-app-wake-receiving/qualification/${{ matrix.config }} --reporter=json --outputFile="${{ runner.temp }}/host-wake-receiving-${{ matrix.suite }}.json"
      - name: Preserve actual qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-app-wake-receiving-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/host-wake-receiving-${{ matrix.suite }}.json
          if-no-files-found: error
