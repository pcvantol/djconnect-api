name: WidgetKit first-key source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-api

  worker:
    name: Isolated WidgetKit first-key Worker and D1
    needs: software-assurance-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test -- --run --config qualification/widget-ha-dev/vitest.config.mts
