name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "24 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-aabd.yml@4025a68add8ba98f1f2e0307d7f3998e45c0d9ef
    with:
      execution_profile: balanced
      owner: djconnect-music-dj/djconnect-api

  codeql:
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/djconnect-codeql-191.yml@4025a68add8ba98f1f2e0307d7f3998e45c0d9ef # Current canonical workflow closure
    with:
      languages: javascript-typescript
