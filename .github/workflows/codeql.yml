name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "24 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-api

  codeql:
    uses: pcvantol/djconnect/.github/workflows/djconnect-codeql-ci.yml@191b4561bdb659bd2e02905b5bce9643d4390a63 # Current canonical workflow closure
    with:
      languages: javascript-typescript
