name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@946fc839b19dda57230e44a38e170276f3c5eb12
    with:
      policy_source_ref: 946fc839b19dda57230e44a38e170276f3c5eb12
      required_main_workflow: Validate
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: active_source
      coverage_artifact_name: api-cobertura-coverage
      durable_evidence_release_tag_prefix: internal-api
