name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@733ecc2836d40611b2b7472308a7175a6130c91a
    with:
      policy_source_ref: 733ecc2836d40611b2b7472308a7175a6130c91a
      required_main_workflow: Validate
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery", "Validate", "Owner Authorization"]'
      repository_role: active_source
      coverage_artifact_name: api-cobertura-coverage
      durable_evidence_release_tag_prefix: internal-api
