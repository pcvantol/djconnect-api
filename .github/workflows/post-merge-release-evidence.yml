name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/post-merge-release-evidence-org-487.yml@38018fb71005d09e2eb8a58277bd7bfc500c8528
    with:
      policy_source_ref: e02b452ed799b82a05500efbaa5ee41f74a046ed
      required_main_workflow: Validate
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery", "Validate", "Owner Authorization"]'
      repository_role: active_source
      coverage_artifact_name: api-cobertura-coverage
      durable_evidence_release_tag_prefix: internal-api
